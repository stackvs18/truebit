[project]
name = "truebit"
version = "0.2.0"
description = "Catch fake lossless and fake 320 kbps audio from your terminal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vraj Patel" }]
dependencies = ["typer>=0.12", "rich>=13", "numpy>=1.26", "scipy>=1.11",
                "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "tzdata>=2024.1"]

[project.scripts]
truebit = "truebit.cli:app"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/truebit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
